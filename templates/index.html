<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RefCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    html{-webkit-text-size-adjust:100%}
    body{margin:0}
    img{max-width:100%}
    [hidden]{display:none!important}
  </style>
  <style>

  :root{
    --bg:#F8FAFC;
    --card:#FFFFFF;
    --line:#E4E9F0;
    --line-2:#EEF2F6;

    --navy:#102A43;
    --ink:#142235;
    --ink-2:#64748B;
    --ink-3:#8A98A8;

    --blue:#2563EB;
    --blue-dark:#1D4ED8;
    --blue-soft:#EEF4FF;
    --blue-rule:#CFDEFB;

    --red:#D93A52;
    --red-bg:#FDECEF;
    --red-soft:#FDF2F4;
    --red-rule:#F6CBD3;
    --red-mark:#FCE1E6;

    --amber:#C47700;
    --amber-bg:#FFF4DE;
    --amber-soft:#FFF7E6;
    --amber-rule:#F5DDB0;

    --green:#169B62;
    --green-mark:#DDF3E8;

    --shadow:0 10px 28px rgba(16,42,67,.08);
    --sans:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --r:16px;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
  }
  :where(button,a):focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

  .wrap{
    width:min(1080px, calc(100% - 40px));
    margin:0 auto;
    padding:40px 0 64px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  /* ---------- Cabecera ---------- */
  h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--blue)}
  .page-head p{margin:5px 0 0;font-size:15px;color:var(--ink-2)}

  .ficha{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:24px 26px;
  }
  .ident{
    margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px 36px;
  }
  .ident div{display:flex;flex-direction:column;gap:2px}
  .ident dt{
    font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-3);margin:0;
  }
  .ident dd{margin:0;font-size:14.5px;color:var(--ink);line-height:1.45}
  .ident code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13.5px;background:var(--bg);padding:1px 6px;border-radius:5px;
  }
  .verdict{
    margin:22px 0 0;padding:18px 0 0;border-top:1px solid var(--line-2);
    font-size:17px;line-height:1.5;color:var(--ink);
  }
  .verdict b{font-weight:700}
  .method{
    margin:0;font-size:14.5px;line-height:1.65;color:var(--ink-2);max-width:88ch;
  }
  @media (max-width:720px){
    .ident{grid-template-columns:1fr}
    .ficha{padding:20px}
    .head-top{flex-direction:column-reverse;align-items:flex-start;gap:14px}
    .page-head .brand{margin:0}
  }

  .case-head .fuente{
    font-size:14.5px;color:var(--ink-2);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:22ch;
  }
  .case-head .fuente::after{content:"·";color:var(--ink-3);margin:0 0 0 10px}

  .section-title .nota{
    display:block;margin:5px 0 0;font-size:13px;line-height:1.5;
    font-weight:400;color:var(--ink-3);max-width:72ch;
  }

  /* ---------- Glosario ---------- */
  .glosario{
    border-top:1px solid var(--line);padding:26px 0 0;margin:10px 0 0;
  }
  .glosario h2{
    margin:0 0 4px;font-size:17px;font-weight:700;color:var(--ink);
  }
  .glosario > p{margin:0 0 18px;font-size:14.5px;color:var(--ink-2)}
  .glosario dl{
    margin:0;display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);
    gap:11px 26px;
  }
  .glosario dt{
    margin:0;font-size:14.5px;font-weight:600;color:var(--ink);
  }
  .glosario dt .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:8px;vertical-align:middle;
  }
  .glosario dt .dot.c{background:var(--red)}
  .glosario dt .dot.m{background:var(--amber)}
  .glosario dd{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
  @media (max-width:720px){
    .glosario dl{grid-template-columns:1fr;gap:3px 0}
    .glosario dd{margin:0 0 12px}
    .case-head .fuente{display:none}
  }

  /* ---------- Filtros como tarjetas ---------- */
  .stats{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:16px}
  .stat{
    display:flex;align-items:center;gap:18px;
    padding:22px 24px;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    font:inherit;color:inherit;cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .stat:hover{border-color:#cfd6e2}
  .stat[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .stat-icon{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:grid;place-items:center}
  .stat-icon svg{width:22px;height:22px}
  .stat-icon.red{background:var(--red-soft);color:var(--red)}
  .stat-icon.amber{background:var(--amber-soft);color:var(--amber)}
  .stat-text{display:flex;flex-direction:column;gap:2px;min-width:0}
  .stat-label{font-size:14px;color:var(--ink-2)}
  .stat-value{display:flex;align-items:baseline;gap:7px}
  .stat-value b{font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat-value span{font-size:14.5px;color:var(--ink-2)}
  .stat-hint{font-size:13px;color:var(--ink-3);margin-top:4px}

  .active-filter{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 20px;background:var(--blue-soft);border:1px solid var(--blue-rule);
    border-radius:10px;font-size:14.5px;color:var(--ink-2);
  }
  .active-filter[hidden]{display:none}
  .active-filter b{color:var(--ink);font-weight:700}
  .clear{
    font:inherit;font-size:14.5px;font-weight:700;color:var(--blue);
    background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  }

  /* ---------- Lista de casos ---------- */
  .list{display:flex;flex-direction:column;gap:16px}
  .case{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .case[hidden]{display:none}
  .case-head{
    width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;
    padding:18px 24px;background:none;border:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  }
  .case-head:hover{background:#fbfcfe}
  .case-main{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
  .marker{
    font-size:13px;font-weight:700;color:var(--ink-2);
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:5px 11px;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap;
  }
  .disclose{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:14.5px;font-weight:600;white-space:nowrap}
  .pill{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:8px;white-space:nowrap}
  .pill-green{color:var(--green);background:var(--green-mark)}
  .pill-red{color:var(--red);background:var(--red-bg)}
  .pill-amber{color:var(--amber);background:var(--amber-bg)}
  .toggle-sq{
    width:36px;height:36px;border:1px solid var(--line);border-radius:9px;flex-shrink:0;
    display:grid;place-items:center;color:var(--ink-2);background:var(--card);
    transition:transform .2s ease;
  }
  .toggle-sq svg{width:14px;height:14px}
  .case-head[aria-expanded="true"] .toggle-sq{transform:rotate(180deg)}
  @media (prefers-reduced-motion: reduce){.toggle-sq{transition:none}}

  .case-body{display:flex;flex-direction:column}
  .case-body[hidden]{display:none}

  .panels{
    display:grid;grid-template-columns:repeat(2, minmax(0,1fr));
    border:1px solid var(--line);border-radius:var(--r);
    margin:0 24px 22px;overflow:hidden;
  }
  .panel{padding:22px 24px 26px}
  .panel + .panel{border-left:1px solid var(--line)}
  .panel-head{display:flex;align-items:center;flex-wrap:wrap;gap:11px;margin-bottom:16px}
  .panel-head svg{width:19px;height:19px;color:var(--ink-3)}
  .panel-head b{font-size:15px;font-weight:700;color:var(--ink)}
  .panel-head span{font-size:14.5px;color:var(--ink-2);font-weight:500}
  .panel p{margin:0;font-size:15.5px;line-height:1.85;color:var(--ink)}
  .panel p.plain{line-height:1.7;color:var(--ink-2)}
  .panel p.plain b{color:var(--ink);font-weight:700}
  .panel p.origen{margin:0 0 12px;font-size:13px;color:var(--ink-3);font-weight:500}
  .panel p.origen b{color:var(--ink-2);font-weight:700}
  mark{color:inherit;padding:3px 6px;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  mark.claim{background:var(--red-mark)}
  mark.source{background:var(--green-mark)}

  .section{padding:22px 24px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:12px}
  .section-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  .section-title{display:flex;align-items:center;gap:11px}
  .section-title svg{width:19px;height:19px;color:var(--ink-3)}
  .section-title b{font-size:15px;font-weight:700;color:var(--ink)}
  .link{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:var(--blue);text-decoration:none}
  .link:hover{text-decoration:underline;text-underline-offset:3px}
  .link svg{width:15px;height:15px}
  .ref{margin:0;font-size:14.5px;line-height:1.75;color:var(--ink-2)}
  .ref-marker{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .ref.dead .ref-marker{color:var(--ink-3)}
  .ref.dead{text-decoration:line-through;color:var(--ink-3)}

  .observacion{margin:0;font-size:15px;line-height:1.7;color:var(--ink-2);max-width:92ch}

  .rewrite{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:#fbfcfe}
  .rewrite-body{display:flex;align-items:flex-start;gap:16px}
  .rewrite-body p{margin:0;font-size:15px;line-height:1.7;color:var(--ink-2);flex-grow:1}
  .copy{
    flex-shrink:0;width:36px;height:36px;border:none;background:none;border-radius:9px;
    display:grid;place-items:center;color:var(--ink-3);cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .copy:hover{background:var(--line-2);color:var(--ink)}
  .copy svg{width:17px;height:17px}
  .copy[data-done="1"]{color:#0f9d58}

  /* ---------- Título del manuscrito revisado ---------- */
  .page-head{padding:14px 0 4px}
  .head-top{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:32px;margin:0 0 4px;
  }
  .page-head .brand{
    margin:5px 0 0;flex:none;font-size:17px;font-weight:800;
    letter-spacing:-.01em;color:var(--ink);
    padding:7px 15px;background:var(--card);
    border:1px solid var(--line);border-radius:99px;
  }
  .page-head .brand span{color:var(--blue)}
  .page-head .doc-title{
    margin:14px 0 0;font-size:16px;line-height:1.55;font-weight:500;
    font-style:italic;color:var(--ink-2);max-width:80ch;
  }

  /* ---------- Caso de metadatos: comparación de la referencia ---------- */
  .ai-sentence{padding:22px 24px 0}
  .ai-quote{margin:0;font-size:16px;line-height:1.75;font-style:italic;color:var(--ink)}
  .refbox{
    margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13.5px;line-height:1.95;padding:15px 17px;border-radius:10px;
    word-break:break-word;
  }
  .refbox.bad,.refbox.good{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
  .refbox.none{
    background:var(--bg);border:1px solid var(--line);color:var(--ink-2);
    font-family:var(--sans);font-size:14.5px;line-height:1.7;font-style:italic;
  }
  .refbox mark{padding:2px 5px;border-radius:5px}
  .diffs{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  .diffs li{position:relative;padding-left:21px;font-size:15px;line-height:1.65;color:var(--ink-2)}
  .diffs li::before{
    content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;
    border-radius:50%;background:var(--blue)
  }

  @media (max-width: 900px){
    .wrap{width:calc(100% - 24px);padding:26px 0 44px}
    .stats{grid-template-columns:1fr}
    .panels{grid-template-columns:1fr;margin:0 18px 18px}
    .ai-sentence{padding:18px 18px 0}
    .panel + .panel{border-left:none;border-top:1px solid var(--line)}
    .case-head{padding:18px 18px}
    .section{padding:18px 18px}
    h1{font-size:22px}
  }

  /* ---- additions for the data-driven template ---- */
  .doc-title:empty{display:none}
  .ident:empty{display:none}
  .ident:empty + .verdict{border-top:0;margin-top:0;padding-top:0}


  /* ---------- RefCheck brand theme (editorial dashboard) ---------- */
  body{font-size:15px}
  .topbar{
    background:#fff;border-bottom:1px solid var(--line);
    height:72px;display:flex;align-items:center;
  }
  .topbar-inner{width:min(1080px, calc(100% - 40px));margin:0 auto;display:flex;align-items:center}
  .topbar .logo{height:34px;width:auto;display:block}
  .page-head{padding:6px 0 0}
  h1{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}
  .page-head .doc-title{margin:8px 0 0;font-size:15.5px;font-weight:500;color:var(--ink-2)}

  .ficha,.stat,.case{border-radius:var(--r);box-shadow:var(--shadow)}
  .ident dt{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-3)}
  .ident dd{color:var(--navy);font-weight:600}
  .ident code{background:var(--bg);border:1px solid var(--line);color:var(--navy);font-weight:500}
  .verdict{color:var(--navy)}

  .stat-icon{border-radius:14px}
  .stat-label{color:var(--ink-2);font-weight:600}
  .stat-value b{color:var(--navy);font-weight:800}
  .stat:hover{border-color:#CBD6E2}

  .marker{border-radius:10px;color:var(--navy);background:#FBFCFE}
  .case-head .fuente{color:var(--ink-2);font-weight:500}
  .pill{border-radius:999px;font-size:12px;font-weight:800;padding:5px 11px}
  .disclose{color:var(--ink-2)}
  .toggle-sq{border-radius:10px;color:var(--navy)}
  .case-head:hover{background:#FBFCFE}

  .panels{border-radius:14px}
  .panel-head svg,.section-title svg{color:var(--blue)}
  .panel-head b,.section-title b{color:var(--navy)}
  .rewrite{border-radius:14px;background:#FAFBFD}
  .refbox{border-radius:12px}
  .link{color:var(--blue);font-weight:700}
  .link:hover{color:var(--blue-dark)}
  .clear{color:var(--blue)}
  .active-filter{border-radius:12px}

  .glosario{border-top:1px solid var(--line)}
  .glosario h2{color:var(--navy);font-size:18px}
  .glosario dt{color:var(--navy)}
  .copy[data-done="1"]{color:var(--green)}

  @media (max-width: 900px){
    .topbar-inner{width:calc(100% - 24px)}
    h1{font-size:24px}
  }


  .ctx{margin-top:14px;padding:12px 14px;background:#F8FAFC;border:1px solid var(--line);border-radius:12px}
  .panel .ctx .ctx-label{margin:0 0 6px;font-size:10.5px;line-height:1.4;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .panel .ctx .ctx-text{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}

  .doi-link{color:var(--blue);text-decoration:underline;text-underline-offset:2px;word-break:break-all}


  .topbar-inner{justify-content:space-between;gap:16px}
  .dl-btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;text-decoration:none;
    font-size:14px;font-weight:700;padding:10px 16px;border-radius:10px;transition:background .15s ease}
  .dl-btn:hover{background:var(--blue-dark)}
  .dl-btn svg{width:17px;height:17px}
  @media print{.dl-btn{display:none!important}}

  .upload-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 20px 16px;
    box-shadow:var(--shadow);
  }
  .upload-form{display:flex;flex-direction:column;gap:12px}
  .upload-row{display:flex;gap:12px;align-items:center}
  .upload-input-wrap{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#F8FAFC;min-height:52px}
  .upload-input-wrap input[type="file"]{flex:1;border:none;background:transparent;color:var(--ink-2);font:inherit;outline:none}
  .upload-input-wrap input[type="file"]::file-selector-button{display:none}
  .upload-button{border:none;border-radius:10px;background:var(--blue);color:#fff;padding:0 22px;height:52px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s ease}
  .upload-button:hover{background:var(--blue-dark)}
  .upload-button[disabled]{opacity:.7;cursor:wait}
  .upload-status{min-height:22px;margin-top:4px;font-size:14px;color:var(--ink-2)}
  .upload-status.error{color:var(--red)}
  .upload-status.success{color:var(--green)}
  @media (max-width: 720px){
    .upload-row{flex-direction:column;align-items:stretch}
    .upload-input-wrap{width:100%}
    .upload-button{width:100%}
  }

  /* ---- print / PDF: same page, every case expanded ---- */
  @media print{
    @page{size:A4;margin:14mm 12mm}
    html,body{background:#fff}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .stat-hint,.disclose,.copy,.active-filter,.link{display:none!important}
    .stat{cursor:default}
    .case-body[hidden]{display:flex!important}
    .case,.ficha,.stat{box-shadow:none}
    .topbar{height:56px}
    .case-head{break-after:avoid}
    .panels,.panel,.section,.ai-sentence,.rewrite{break-inside:avoid}
    .glosario{break-inside:avoid}
  }
  </style>
</head>
<body>

<script id="report-data" type="application/json">{"schema_version":"2","lang":"en","title":"Corticosteroid Signalling and the Control of Skeletal Muscle Growth in Teleost Fish: Receptors, Ligands, and Limits","manuscript_file":"Fish_Endocrinology_Fidelity_Test_Manuscript.docx","references_reviewed":12,"cases":[{"marker":"[2]","kind":"content","source_label":"Faught & Vijayan (2018)","error_type":"source_says_opposite","claim":"Knockout work in zebrafish larvae mapped the division of labour between the two: **MR-null animals were hypercortisolemic and failed to mount any cortisol response to a stressor**, whereas **GR-null animals retained a delayed but sustained response**, indicating that **the mineralocorticoid receptor rather than the glucocorticoid receptor sets the negative-feedback set-point** of the stress axis [2].","evidence":"Despite the high maternal cortisol deposition in GR−/− embryos, this steroid is cleared rapidly, and the low cortisol levels are maintained for 24 h. While the mechanism is unclear as 11β-hsd2 transcript levels are low in GR−/− larvae (Fig. 2A), the excretion of this excess steroid may involve either diffusion36, activation of other biotransformation pathways37 and/or upregulation of efflux transporters38. Except for this brief period, **GR−/−, but not MR−/−mutants were hypercortisolemic** and the steroid levels were beyond what could be induced by a stressor in the WT larvae (Fig. 2A)14. This suggests either a non-functional negative feedback mechanism and/or a lack of cortisol breakdown in the GR mutant. In contrast to GR, **a loss of MR resulted in basal cortisol levels similar to WT** (Fig. 2A), **supporting a key role for GR signalling in maintaining the steady-state basal glucocorticoid levels** during early development32, and this may involve a tight negative feedback regulation in fish.","passage_origin":"full_text","observation":"The full text reports the opposite of the sentence. It is the glucocorticoid receptor mutants, not the mineralocorticoid receptor mutants, that are hypercortisolemic, with cortisol levels beyond what a stressor induces in wild-type larvae, while loss of the mineralocorticoid receptor leaves basal cortisol similar to wild type. The authors attribute basal cortisol control and negative feedback to the glucocorticoid receptor, so the sentence swaps the two receptors and, with them, its conclusion about the feedback set-point.","rewrite":null,"reference":"Faught, E., & Vijayan, M. M. (2018). The mineralocorticoid receptor is essential for stress axis regulation in zebrafish larvae. _Scientific Reports_, 8(1), 18081.","doi":"10.1038/s41598-018-36681-w","reference_id":2},{"marker":"[3]","kind":"content","source_label":"Sturm et al. (2005)","error_type":"inflated_figure","claim":"Measurements in COS-7 cells cotransfected with rainbow trout receptor cDNA place the EC50 of DOC at the trout mineralocorticoid receptor at **1.6 × 10⁻¹³ M, some three orders of magnitude below the value obtained for cortisol, making DOC the most potent corticosteroid ligand described for any vertebrate receptor to date** [3].","evidence":"EC50 = **1.6 ± 0.5 × 10⁻¹⁰** and 1.1 ± 0.4 × 10⁻¹⁰ M, respectively","passage_origin":"abstract","observation":"The source reports an EC50 of 1.6 × 10⁻¹⁰ M for 11-deoxycorticosterone, not 1.6 × 10⁻¹³ M. Against cortisol (1.1 × 10⁻⁹ M) the difference is about sevenfold, not three orders of magnitude. Aldosterone was slightly more potent in the same assay (1.1 × 10⁻¹⁰ M), so 11-deoxycorticosterone is not the most potent ligand reported either.","rewrite":null,"reference":"Sturm, A., Bury, N., Dengreville, L., Fagart, J., Flouriot, G., Rafestin-Oblin, M. E., & Prunet, P. (2005). 11-Deoxycorticosterone is a potent agonist of the rainbow trout (Oncorhynchus mykiss) mineralocorticoid receptor. _Endocrinology_, 146(1), 47-55.","doi":"10.1210/en.2004-0128","evidence_context":"The study characterised two rainbow trout mineralocorticoid receptors (rtMRa and rtMRb) and measured how strongly four corticosteroids activated them in COS-7 cells carrying a luciferase reporter. Both mineralocorticoids, 11-deoxycorticosterone and aldosterone, activated rtMRa at concentrations around 10⁻¹⁰ M, several times lower than those required by the glucocorticoids cortisol and 11-deoxycortisol (around 10⁻⁹ M); rtMRb behaved similarly. Receptor transcripts were found in every tissue examined, highest in brain, and the authors relate these potencies to circulating corticosteroid levels in trout.","reference_id":3},{"marker":"[4]","kind":"content","source_label":"McCormick et al. (2008)","error_type":"source_says_opposite","claim":"**DOC treatment raised gill Na⁺,K⁺-ATPase activity and improved salinity tolerance**, the mineralocorticoid receptor blocker **spironolactone abolished both effects**, and the results **established DOC rather than cortisol as the hormone** that carries out mineralocorticoid function in teleost fish [4].","evidence":"**cortisol, and not DOC or aldosterone,** is involved in regulating the mineralocorticoid functions","passage_origin":"abstract","observation":"The source concludes the opposite: cortisol, not 11-deoxycorticosterone, regulates mineralocorticoid functions. In the study, 11-deoxycorticosterone had no effect on gill Na⁺,K⁺-ATPase activity or on salinity tolerance, and the putative mineralocorticoid receptor blocker spironolactone had no effect either. The sentence reverses all three results.","rewrite":null,"reference":"McCormick, S. D., Regish, A., O'Dea, M. F., & Shrimpton, J. M. (2008). Are we missing a mineralocorticoid in teleost fish? Effects of cortisol, deoxycorticosterone and aldosterone on osmoregulation, gill Na+,K+-ATPase activity and isoform mRNA levels in Atlantic salmon. _General and Comparative Endocrinology_, 157(1), 35-40.","doi":"10.1016/j.ygcen.2008.03.024","evidence_context":"The authors tested whether a hormone other than cortisol carries out mineralocorticoid functions in teleosts, given that fish possess a mineralocorticoid receptor gene. In Atlantic salmon treated for 6–14 days, cortisol raised gill Na⁺,K⁺-ATPase activity, increased the transcripts of both enzyme isoforms and improved salinity tolerance, whereas 11-deoxycorticosterone and aldosterone had no effect on any of these. The glucocorticoid receptor blocker RU486 inhibited the effects of cortisol, while the mineralocorticoid receptor blocker spironolactone did not.","reference_id":4},{"marker":"[7]","kind":"content","source_label":"Aravena-Canales et al. (2021)","error_type":"source_says_opposite","claim":"Cortisol at 10 mg/kg **raised the expression of both atrogin-1 and murf1 as early as three hours after treatment** and held both elevated through nine hours, and the membrane-impermeable analogue cortisol-BSA **reproduced the effect on both genes in isolated myotubes**, showing that the atrophic programme is switched on rapidly and in its entirety through membrane-initiated signalling [7].","evidence":"cortisol (10 mg/kg) **first decreased** the expression of both atrogenes at 3 h","passage_origin":"abstract","observation":"At three hours cortisol decreased the expression of both genes; the increase only appears at nine hours. The source also reports that, in vitro, membrane-initiated cortisol action appears to regulate murf1 but not atrogin-1 in myotubes. The sentence turns a biphasic pattern into an immediate and complete activation.","rewrite":null,"reference":"Aravena-Canales, D., Aedo, J. E., Molina, A., & Valdes, J. A. (2021). Regulation of the early expression of MAFbx/atrogin-1 and MuRF1 through membrane-initiated cortisol action in the skeletal muscle of rainbow trout. _Comparative Biochemistry and Physiology Part B: Biochemistry and Molecular Biology_, 253, 110565.","doi":"10.1016/j.cbpb.2021.110565","evidence_context":"The study asked how quickly cortisol regulates two atrophy-related genes, atrogin-1 and murf1, in rainbow trout skeletal muscle, and whether membrane-initiated signalling is involved, using cortisol and a membrane-impermeable analogue (cortisol-BSA) in fish and in isolated myotubes. In fish given 10 mg/kg cortisol, expression of both genes fell at 3 h and rose only at 9 h. In myotubes, membrane-initiated action appeared to regulate murf1 but not atrogin-1, and experiments with the receptor blocker RU486 pointed to membrane glucocorticoid receptor signalling behind the early drop in murf1.","reference_id":7},{"marker":"[8]","kind":"content","source_label":"Waddell et al. (2008)","error_type":"study_did_not_do_that","claim":"A near-perfect palindromic glucocorticoid response element 200 base pairs upstream of the murf1 transcription start site, with a directly adjacent FOXO binding element, was shown **in trout myotubes** to drive a dramatic synergistic increase in transcription when the glucocorticoid receptor and FOXO1 are co-expressed, and mutation of either element significantly impaired activation [8].","evidence":"The GRE is highly conserved in the **mouse, rat, and human** genes","passage_origin":"abstract","observation":"The study was carried out entirely in mammals: mouse, rat and human genes, HepG2 cells and C2C12 myotubes, and mice in vivo. The mechanism described is real, but the organism is not: there are no trout, or fish of any kind, in the work.","rewrite":null,"reference":"Waddell, D. S., Baehr, L. M., van den Brandt, J., Johnsen, S. A., Reichardt, H. M., Furlow, J. D., & Bodine, S. C. (2008). The glucocorticoid receptor and FOXO1 synergistically activate the skeletal muscle atrophy-associated MuRF1 gene. _American Journal of Physiology-Endocrinology and Metabolism_, 295(4), E785-E797.","doi":"10.1152/ajpendo.00646.2007","evidence_context":"The study examined how glucocorticoids regulate MuRF1, a muscle ubiquitin ligase linked to atrophy. Its promoter carries a near-perfect glucocorticoid response element about 200 base pairs upstream of the start site, next to a FOXO binding element, and both are conserved across mouse, rat and human. The experiments used human HepG2 cells, mouse C2C12 myotubes and mice expressing a dimerisation-deficient glucocorticoid receptor; in the cell assays the receptor and FOXO1 acted synergistically, and mutating either element impaired activation. All experimental systems described are mammalian.","reference_id":8},{"marker":"[9]","kind":"content","source_label":"Cleveland & Weber (2010)","error_type":"inflated_figure","claim":"In primary cultures of rainbow trout myocytes, 100 nM IGF-I increased protein synthesis by **62%** and cut protein degradation by **41%**, and **leucine supplementation independently raised synthesis rates by a comparable margin**, indicating that amino acid availability and growth factor signalling act as parallel and largely interchangeable anabolic stimuli in fish muscle [9].","evidence":"increased protein synthesis by **13%** (P \u003c 0.05) and decreased protein degradation by **14%**","passage_origin":"abstract","observation":"The actual figures are a 13% increase in protein synthesis and a 14% decrease in protein degradation, not 62% and 41%. The source also reports that the additional leucine did not increase protein synthesis rates, so the second half of the sentence presents a null result as a positive one.","rewrite":null,"reference":"Cleveland, B. M., & Weber, G. M. (2010). Effects of insulin-like growth factor-I, insulin, and leucine on protein turnover and ubiquitin ligase expression in rainbow trout primary myocytes. _American Journal of Physiology-Regulatory, Integrative and Comparative Physiology_, 298(2), R341-R350.","doi":"10.1152/ajpregu.00516.2009","evidence_context":"Primary cultures of rainbow trout myocytes were treated with IGF-I, insulin or extra leucine to measure protein turnover. IGF-I at 100 nM raised protein synthesis by 13% and lowered degradation by 14%, and insulin produced similar changes (13% and 17%). An additional 2.5 mM leucine did not raise synthesis and lowered degradation by only 8%. IGF-I and insulin also reduced ubiquitin ligase transcripts in a dose-dependent way through PI3-kinase signalling, while serum deprivation lowered synthesis by 60% and raised degradation by 40%.","reference_id":9},{"marker":"[10]","kind":"content","source_label":"Garikipati & Rodgers (2012)","error_type":"data_mismatch","claim":"IGF-1 stimulated proliferation but had minimal and delayed effects on differentiation and its actions were suppressed by myostatin, while **IGF-1 itself upregulated MSTN-1a expression** and the processing of a transcript that is normally unprocessed [10].","evidence":"However, **IGF-1 upregulated MSTN-2a expression** and the processing of its transcript","passage_origin":"abstract","observation":"The paralog upregulated by IGF-1 is MSTN-2a, not MSTN-1a. The distinction matters: the study describes the IGF-stimulated processing of MSTN-2a transcripts as unique to that paralog, while MSTN-1a is the one autoregulated by myostatin.","rewrite":null,"reference":"Garikipati, D. K., & Rodgers, B. D. (2012). Myostatin inhibits myosatellite cell proliferation and consequently activates differentiation: Evidence for endocrine-regulated transcript processing. _Journal of Endocrinology_, 215(1), 177-187.","doi":"10.1530/JOE-12-0260","evidence_context":"Using rainbow trout myosatellite cells, the study tested how myostatin and IGF-1 affect proliferation and differentiation in a species with four myostatin paralogs. Myostatin suppressed proliferation, and MSTN-1a, the most highly expressed paralog, was autoregulated by myostatin, which also raised differentiation markers. IGF-1 stimulated proliferation with minimal, delayed effects on differentiation, and it increased MSTN-2a expression together with the processing of that normally unprocessed transcript, a feature the authors describe as unique to this paralog.","reference_id":10},{"marker":"[12]","kind":"content","source_label":"Faught & Vijayan (2022)","error_type":"source_says_opposite","claim":"Work in zebrafish skeletal muscle has demonstrated that loss of the mineralocorticoid receptor **impairs metabolic flexibility** and that the receptor is **dispensable for insulin-stimulated glucose uptake**, **confirming that the glucocorticoid receptor alone governs fuel selection** in teleost muscle [12].","evidence":"A loss of MR **abolished** insulin-stimulated glucose uptake in the skeletal muscle","passage_origin":"abstract","observation":"The source says the opposite: loss of the mineralocorticoid receptor abolished insulin-stimulated glucose uptake, so the receptor is required, not dispensable. It also reports that this loss improved GR-driven metabolic flexibility, and the authors present their conclusion as a postulate, not as a confirmed finding.","rewrite":null,"reference":"Faught, E., & Vijayan, M. M. (2022). The mineralocorticoid receptor functions as a key glucose regulator in the skeletal muscle of zebrafish. _Endocrinology_, 163(11), bqac149.","doi":"10.1210/endocr/bqac149","evidence_context":"The study used a zebrafish line lacking the mineralocorticoid receptor, combined with chronic cortisol treatment to activate the glucocorticoid receptor, to separate the metabolic roles of the two receptors in skeletal muscle. At rest the mineralocorticoid receptor favoured nutrient storage, whereas glucocorticoid receptor activation increased nutrient use, and loss of the mineralocorticoid receptor improved glucocorticoid-driven metabolic flexibility. In fish co-injected with insulin and a fluorescent glucose analogue, absence of the receptor eliminated insulin-stimulated glucose uptake; the authors postulate a key modulatory role for the receptor in muscle glucose metabolism.","reference_id":12},{"marker":"[1]","kind":"metadata","source_label":"Bury & Sturm (2007)","error_type":"wrong_reference_details","claim":"A genome duplication early in the evolutionary history of the teleosts left the group with two glucocorticoid receptors and a single mineralocorticoid receptor, and teleosts lack aldosterone, with cortisol regarded as the principal corticosteroid; 11-deoxycorticosterone (DOC) has nonetheless been identified as an agonist of the rainbow trout mineralocorticoid receptor, raising the possibility that it is the ancestral ligand of that receptor [1].","reference_as_generated":"Bury NR, Sturm A. Evolution of the corticosteroid receptor signalling pathway in fish. **Mol Cell Endocrinol**. **2008**;**289(1-2)**:47-56. doi: 10.1016/j.ygcen.2007.03.009","reference_official":"Bury NR, Sturm A. Evolution of the corticosteroid receptor signalling pathway in fish. **Gen Comp Endocrinol**. **2007**;**153(1-3)**:47-56. doi: 10.1016/j.ygcen.2007.03.009","observation":"The article exists and the DOI is correctly written: it leads to the genuine article. The authors, title and page numbers are also correct. Three details are wrong:","findings":["The correct journal is _General and Comparative Endocrinology_, not _Molecular and Cellular Endocrinology_","The correct year is 2007, not 2008","The correct volume and issue are 153(1-3), not 289(1-2)"],"rewrite":"Correct the journal, year and volume according to the official record.","doi":"10.1016/j.ygcen.2007.03.009","reference_id":1}],"pdf_filename":"RefCheck_Report_Fish_Endocrinology.pdf","report_complete":true}</script>
<script id="report-i18n" type="application/json">{"en":{"title":"Citation Fidelity Review","preparedFor":"Prepared for","manuscript":"Manuscript reviewed","issuedBy":"Issued by","statContent":"Citations the source does not support","statMeta":"References with metadata problems","unit":["citation","citations"],"refUnit":["reference","references"],"hint":"Click to see only these cases","method":"Each displayed content finding identifies the cited passage used for assessment. Bibliographic findings compare the reference with the corresponding official record. Each error type is explained at the end of the report.","filterContent":"Showing only <b>citations the source does not support</b>.","filterMeta":"Showing only <b>references with metadata problems</b>.","viewAll":"View all cases","showEv":"Show evidence","hideEv":"Hide evidence","claimPanel":"What the reviewed manuscript claims","sourcePanel":"What the source says","sourcePanelNote":"(passage from the cited work)","origin":"Passage source:","originAbstract":"Abstract","originFull":"Full text","observation":"RefCheck observation","rewrite":"Suggested rewrite","rewriteNote":"This only fixes the flagged point, based on what the passage shows. Final revision of the text is the author’s responsibility.","copyRewrite":"Copy rewrite","copySuggestion":"Copy suggestion","citedSource":"Cited source","viewSource":"View source","metaClaim":"The claim this reference supports","metaGenerated":"As generated in the report","metaOfficial":"Reference according to the official record","noRecord":"Official record not available.","suggestion":"Suggestion","suggestionNote":"Correcting the bibliographic entry is the author’s responsibility.","glossaryTitle":"Error types","glossaryBoth":"First the errors in the content of the citation; then those in the bibliographic details.","glossaryContent":"All relate to the content of the citation.","glossaryMeta":"All relate to the bibliographic details.","verdict_none":"{n} references were reviewed. <b>None contain errors.</b>","verdict_one":"{n} references were reviewed. <b>1 contains an error.</b>","verdict_many":"{n} references were reviewed. <b>{m} contain errors.</b>","contextLabel":"Surrounding passage, summarised (not a quotation)","downloadPdf":"Download PDF"}}</script>

ork does not report."}},"overstated_certainty":{"kind":"content","label":{"es":"Certeza exagerada","en":"Overstated certainty"},"desc":{"es":"La oración presenta como demostrado lo que la fuente plantea como hipótesis o asociación.","en":"The sentence presents as established what the source reports as a hypothesis or an association."}},"wrong_reference_details":{"kind":"metadata","label":{"es":"Datos de la referencia incorrectos","en":"Incorrect reference details"},"desc":{"es":"El artículo existe, pero uno o más campos bibliográficos no coinciden con el registro oficial.","en":"The article exists, but one or more bibliographic fields do not match the official record."},"suggestion":{"es":"Corrija la entrada bibliográfica según el registro oficial.","en":"Correct the bibliographic entry according to the official record."}},"retracted_article":{"kind":"metadata","label":{"es":"Artículo retractado","en":"Retracted article"},"desc":{"es":"El artículo citado tiene un aviso de retracción registrado.","en":"The cited article has a registered retraction notice."},"suggestion":{"es":"Reemplace o retire la cita del artículo retractado.","en":"Replace or remove the citation of the retracted article."}},"doi_leads_elsewhere":{"kind":"metadata","label":{"es":"El DOI lleva a otro artículo","en":"DOI leads to a different article"},"desc":{"es":"El DOI declarado corresponde a un artículo distinto del citado.","en":"The declared DOI belongs to an article other than the one cited."},"suggestion":{"es":"Corrija el DOI de la referencia.","en":"Correct the DOI of the reference."}},"citation_without_reference":{"kind":"metadata","label":{"es":"Cita sin referencia","en":"Citation without a reference"},"desc":{"es":"El texto cita un número que no aparece en la lista de referencias.","en":"The text cites a number that does not appear in the reference list."},"suggestion":{"es":"Agregue la referencia a la lista o corrija el número de la cita.","en":"Add the reference to the list or correct the citation number."}}}</script>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  1. DATA  (three JSON blocks injected by build/render.py)          *
   *     #report-data        the report itself (per manuscript)         *
   *     #report-i18n        interface text, one object per language    *
   *     #report-error-types catalog of error types (labels, meaning)   *
   * ------------------------------------------------------------------ */
  function readJSON(id) {
    return JSON.parse(document.getElementById(id).textContent);
  }
  var DATA, I18N, CATALOG;
  try {
    DATA = readJSON('report-data');
    I18N = readJSON('report-i18n');
    CATALOG = readJSON('report-error-types');
  } catch (err) {
    document.body.innerHTML =
      '<p style="font:16px system-ui;padding:40px;max-width:640px;margin:auto">' +
      'RefCheck template: no valid report data found. Render this file with <code>build/render.py</code> ' +
      'so the JSON blocks are injected.</p>';
    return;
  }

  // The approved report contract is English-only; reject invalid input.
  if (DATA.lang !== 'en' || !I18N.en || !Array.isArray(DATA.cases)) {
    document.body.textContent = 'Invalid report data: English report and cases array required.';
    return;
  }
  var LANG = 'en';
  var T = I18N.en;

  /* ------------------------------------------------------------------ *
   *  2. ERROR TYPE CATALOG  (template/error_types.json + data.error_types) *
   * ------------------------------------------------------------------ */
  var ORDER = Object.keys(CATALOG);
  // The final catalogue is fixed: 8 scientific + 4 bibliographic labels.
  var ALLOWED_TYPES = ['source_says_opposite','study_did_not_do_that','data_mismatch',
    'inflated_figure','figure_out_of_context','measure_confused',
    'source_does_not_say','overstated_certainty','wrong_reference_details',
    'retracted_article','doi_leads_elsewhere','citation_without_reference'];
  if (ORDER.length !== ALLOWED_TYPES.length ||
      ALLOWED_TYPES.some(function (k) { return !Object.prototype.hasOwnProperty.call(CATALOG,k); })) {
    document.body.textContent = 'Invalid report: error-type catalogue does not match approved categories.';
    return;
  }
  // No data-provided extra categories or label overrides are accepted.
  if (DATA.error_types) {
    document.body.textContent = 'Invalid report: category overrides are not allowed.';
    return;
  }
  function pick(obj) { return obj ? (obj.en || '') : ''; }

  /* ------------------------------------------------------------------ *
   *  3. TEXT HELPERS                                                   *
   *     Data is plain text. Everything is HTML-escaped first, then a   *
   *     tiny markup is applied:  **text** = highlight,  _text_ = italic *
   * ------------------------------------------------------------------ */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function italics(h) {
    return h.replace(/(^|[\s(\u201c"])_([^_\n]+?)_(?=[\s).,;:\u201d"]|$)/g, '$1<i>$2</i>');
  }
  function marked(s, cls) {       // highlighted text (claims, evidence, references)
    return italics(esc(s).replace(/\*\*([\s\S]+?)\*\*/g, '<mark class="' + cls + '">$1</mark>'));
  }
  function rich(s) {              // free text written by a person or a model
    return italics(esc(s).replace(/\*\*([\s\S]+?)\*\*/g, '<b>$1</b>'));
  }
  function plainText(s) {         // text without markup, for clipboard
    return String(s == null ? '' : s).replace(/\*\*/g, '');
  }
  function doiLinks(html, c) {     // makes the DOI clickable inside a reference box, only if it resolves
    if (!c.doi || c.doi_dead) return html;
    // Only generate a hyperlink for a DOI with valid URL-safe syntax.
    if (!/^10\.\d{4,9}\/[^\s<>"']+$/i.test(String(c.doi))) return html;
    var d = esc(c.doi);
    return html.split(d).join('<a class="doi-link" href="https://doi.org/' + d + '" target="_blank" rel="noopener">' + d + '</a>');
  }
  function markerOf(m) {
    m = String(m).trim();
    return /^\d+$/.test(m) ? '[' + m + ']' : m;
  }
  function sourceLink(c) {
    if (c.doi_dead) return '';
    if (c.doi && /^10\.\d{4,9}\/[^\s<>"']+$/i.test(String(c.doi)))
      return 'https://doi.org/' + c.doi;
    if (c.source_url && /^https?:\/\/[^\s<>"']+$/i.test(String(c.source_url)))
      return c.source_url;
    return '';
  }

  /* ------------------------------------------------------------------ *
   *  4. ICONS                                                          *
   * ------------------------------------------------------------------ */
  var A = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
  var chevron = '<span class="toggle-sq" aria-hidden="true"><svg ' + A + ' stroke-width="2.2"><path d="m6 14.5 6-6 6 6"/></svg></span>';
  var iconChat = '<svg ' + A + ' stroke-width="1.8"><path d="M20 12a7.5 7.5 0 0 1-7.5 7.5H8L4 22l1-3.6A7.5 7.5 0 1 1 20 12Z"/><path d="M9 11.5h.01"/><path d="M12.5 11.5h.01"/><path d="M16 11.5h.01"/></svg>';
  var iconBook = '<svg ' + A + ' stroke-width="1.8"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>';
  var iconDoc = '<svg ' + A + ' stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
  var iconSearch = '<svg ' + A + ' stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>';
  var iconBulb = '<svg ' + A + ' stroke-width="1.8"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.7h6c0-.7.3-1.3.8-1.7A6.5 6.5 0 0 0 12 2.5Z"/></svg>';
  var iconPencil = '<svg ' + A + ' stroke-width="1.8"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7.5 18.5l-4 1 1-4Z"/><path d="M14.5 5.5l3 3"/></svg>';
  var iconCopy = '<svg ' + A + ' stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
  var iconExt = '<svg ' + A + ' stroke-width="2"><path d="M14 4h6v6"/><path d="M20 4 10.5 13.5"/><path d="M18 14v5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V8a1.5 1.5 0 0 1 1.5-1.5H10"/></svg>';
  var iconCheck = '<svg ' + A + ' stroke-width="2.2"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

  /* ------------------------------------------------------------------ *
   *  5. NORMALISE CASES                                                *
   * ------------------------------------------------------------------ */
  var CASES = (DATA.cases || []).map(function (c, i) {
    var o = {};
    Object.keys(c).forEach(function (k) { o[k] = c[k]; });
    o.id = o.id || ('c' + (i + 1));
    o.marker = markerOf(o.marker);
    return o;
  });
  if (DATA.report_complete !== true) {
    document.body.textContent = 'Report incomplete: FINAL publication is blocked.';
    return;
  }
  // Validate every case before rendering or counting it. This must be checked
  // again server-side by the production exporter before marking a run FINAL.
  if (CASES.some(function (c) {
    return c.reference_id == null || !String(c.reference_id).trim() ||
      !CATALOG[c.error_type] || CATALOG[c.error_type].kind !== c.kind ||
      (c.error_type === 'citation_without_reference' && c.count_as_reference !== false) ||
      (c.error_type !== 'citation_without_reference' && c.count_as_reference === false) ||
      (c.error_type === 'doi_leads_elsewhere' && (c.doi_dead !== true || c.reference_official)) ||
      (c.error_type === 'wrong_reference_details' && !c.reference_official);
  })) {
    document.body.textContent = 'Invalid report: case identity, category or metadata contract failed.';
    return;
  }
  CASES.sort(function (a, b) {
    return parseInt(a.marker.replace(/\D/g, ''), 10) - parseInt(b.marker.replace(/\D/g, ''), 10);
  });
  function typeOf(c) {
    var e = CATALOG[c.error_type];
    return {
      label: e ? pick(e.label) : String(c.error_type),
      desc: e ? pick(e.desc) : '',
      kind: (e && e.kind) || c.kind,
      suggestion: e ? pick(e.suggestion) : ''
    };
  }

  var REQUIRED_ERROR_TAXONOMY = [
    'The source says the opposite',
    'The study did not do that',
    'Data does not match the study',
    'Inflated figure',
    'Figure taken out of context',
    'One measure confused with another',
    'Incorrect reference details',
    'Fabricated reference',
    'reference list/bibliography'
  ];
  function getMatchReasonKey(match) {
    if (match && match.status) return match.status;
    if (match && match.match_rule) return match.match_rule;
    if (match && match.primary_family) return match.primary_family;
    return 'unknown';
  }
  function getObservationText(match) {
    if (!match) return '';
    return match.observation || match.reason || match.explanation || '';
  }

  /* ------------------------------------------------------------------ *
   *  6. CASE RENDERING                                                 *
   * ------------------------------------------------------------------ */
  function head(c) {
    var t = typeOf(c);
    return '<button class="case-head" aria-expanded="false" aria-controls="b-' + esc(c.id) + '">' +
      '<span class="case-main">' +
        '<span class="marker">' + esc(c.marker) + '</span>' +
        '<span class="fuente">' + esc(c.source_label) + '</span>' +
        '<span class="pill ' + (c.kind === 'metadata' ? 'pill-amber' : 'pill-red') + '">' + esc(t.label) + '</span>' +
      '</span>' +
      '<span class="disclose"><span class="disclose-label">' + T.showEv + '</span>' + chevron + '</span>' +
    '</button>';
  }

  function copyBox(text, label) {
    return '<div class="rewrite"><div class="rewrite-body"><p data-rewrite>' + esc(plainText(text)) + '</p>' +
      '<button class="copy" title="' + esc(label) + '" aria-label="' + esc(label) + '">' + iconCopy + '</button></div></div>';
  }

  function renderContent(c) {
    var evidence = c.evidence
      ? '<p>\u201c' + marked(c.evidence, 'source') + '\u201d</p>'
      : '<p class="plain">' + marked(c.evidence_plain || '', 'source') + '</p>';

    var context = c.evidence_context
      ? '<div class="ctx"><p class="ctx-label">' + (T.contextLabel || 'Surrounding passage, summarised') + '</p><p class="ctx-text">' + rich(c.evidence_context) + '</p></div>'
      : '';
    var origin = '';
    if (c.passage_origin) {
      origin = '<p class="origen">' + T.origin + ' <b>' +
        (c.passage_origin === 'full_text' ? T.originFull : T.originAbstract) + '</b></p>';
    }

    var link = sourceLink(c);
    var linkBtn = link ? '<a class="link" href="' + esc(link) + '" target="_blank" rel="noopener">' + T.viewSource + ' ' + iconExt + '</a>' : '';

    var rewrite = c.rewrite
      ? '<section class="section"><span class="section-title">' + iconPencil + '<b>' + T.rewrite + '</b>' +
          '<span class="nota">' + T.rewriteNote + '</span></span>' + copyBox(c.rewrite, T.copyRewrite) + '</section>'
      : '';

    return '<article class="case" data-kind="content">' + head(c) +
      '<div class="case-body" id="b-' + esc(c.id) + '" hidden>' +
        '<div class="panels">' +
          '<section class="panel"><div class="panel-head">' + iconChat + '<b>' + T.claimPanel + '</b></div><p>' + marked(c.claim, 'claim') + '</p></section>' +
          '<section class="panel"><div class="panel-head">' + iconBook + '<b>' + T.sourcePanel + '</b> <span>' + T.sourcePanelNote + '</span></div>' + origin + evidence + context + '</section>' +
        '</div>' +
        '<section class="section"><span class="section-title">' + iconSearch + '<b>' + T.observation + '</b></span>' +
          '<p class="observacion">' + rich(c.observation || '') + '</p></section>' +
        rewrite +
        '<section class="section"><div class="section-head"><span class="section-title">' + iconDoc + '<b>' + T.citedSource + '</b></span>' + linkBtn + '</div>' +
          '<p class="' + (c.doi_dead ? 'ref dead' : 'ref') + '"><span class="ref-marker">' + esc(c.marker) + '</span> ' + italics(esc(c.reference || '')) +
          (link ? ' <a class="doi-link" href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link) + '</a>' : '') + '</p></section>' +
      '</div></article>';
  }

  function renderMetadata(c) {
    var t = typeOf(c);
    var noOfficialText = c.error_type === 'doi_leads_elsewhere'
      ? 'The declared DOI identifies a different article.'
      : (c.error_type === 'citation_without_reference'
        ? 'No corresponding entry in the bibliography.'
        : 'Official bibliographic record not available.');
    var official = c.reference_official
      ? '<p class="refbox good">' + doiLinks(marked(c.reference_official, 'source'), c) + '</p>'
      : '<p class="refbox none">' + esc(noOfficialText) + '</p>';

    var bullets = (c.findings || []).map(function (f) { return '<li>' + rich(f) + '</li>'; }).join('');
    var suggestionText = c.rewrite || t.suggestion;
    var suggestion = suggestionText
      ? '<section class="section"><span class="section-title">' + iconBulb + '<b>' + T.suggestion + '</b>' +
          '<span class="nota">' + T.suggestionNote + '</span></span>' + copyBox(suggestionText, T.copySuggestion) + '</section>'
      : '';

    return '<article class="case" data-kind="metadata">' + head(c) +
      '<div class="case-body" id="b-' + esc(c.id) + '" hidden>' +
        '<section class="ai-sentence"><div class="panel-head">' + iconChat + '<b>' + T.metaClaim + '</b></div>' +
          '<p class="ai-quote">\u00ab' + esc(c.claim) + '\u00bb</p></section>' +
        '<div class="panels">' +
          '<section class="panel"><div class="panel-head">' + iconDoc + '<b>' + T.metaGenerated + '</b></div>' +
            '<p class="refbox bad">' + doiLinks(marked(c.reference_as_generated || '', 'claim'), c) + '</p></section>' +
          '<section class="panel"><div class="panel-head">' + iconBook + '<b>' + T.metaOfficial + '</b></div>' + official + '</section>' +
        '</div>' +
        '<section class="section"><span class="section-title">' + iconSearch + '<b>' + T.observation + '</b></span>' +
          (c.observation ? '<p class="observacion">' + rich(c.observation) + '</p>' : '') +
          (bullets ? '<ul class="diffs">' + bullets + '</ul>' : '') + '</section>' +
        suggestion +
      '</div></article>';
  }

  /* ------------------------------------------------------------------ *
   *  7. PAGE                                                           *
   * ------------------------------------------------------------------ */
  document.documentElement.lang = LANG;
  document.title = T.title + ' \u2014 RefCheck';
  document.getElementById('t-title').textContent = T.title;
  document.getElementById('doc-title').textContent = DATA.title || '';

  var identRows = [
    [T.preparedFor, DATA.prepared_for, false],
    [T.manuscript, DATA.manuscript_file, true],
    [T.issuedBy, DATA.issued_by, false]
  ].filter(function (r) { return r[1]; });
  document.getElementById('ident').innerHTML = identRows.map(function (r) {
    return '<div><dt>' + esc(r[0]) + '</dt><dd>' + (r[2] ? '<code>' + esc(r[1]) + '</code>' : esc(r[1])) + '</dd></div>';
  }).join('');

  // Count bibliography entries, not individual finding rows. A single cited
  // work may have content and metadata problems (or several metadata defects).
  // The legacy example lacks reference_id; production requires it on every case.
  // Cases with count_as_reference === false (a citation marker with no entry
  // in the reference list) are shown but are not bibliography entries.
  function referenceKey(c) {
    // Production never estimates identity from citation markers.
    if (c.reference_id == null || !String(c.reference_id).trim()) {
      throw new Error('Missing reference_id in report case');
    }
    return 'id:' + String(c.reference_id).trim();
  }
  var refCases = CASES.filter(function (c) { return c.count_as_reference !== false; });
  var contentCases = refCases.filter(function (c) { return c.kind === 'content'; });
  var nContent = new Set(contentCases.map(referenceKey)).size;
  var metaCases = refCases.filter(function (c) { return c.kind === 'metadata'; });
  var nMeta = new Set(metaCases.map(referenceKey)).size;
  var nAffectedReferences = new Set(refCases.map(referenceKey)).size;
  // Strict: never fabricate the number of reviewed references from finding rows.
  var reviewed = DATA.references_reviewed;
  if (!Number.isSafeInteger(reviewed) || reviewed < 0 || nAffectedReferences > reviewed) {
    throw new Error('Invalid references_reviewed: must be a nonnegative integer >= distinct affected references');
  }

  var verdictTpl = nAffectedReferences === 0 ? T.verdict_none : (nAffectedReferences === 1 ? T.verdict_one : T.verdict_many);
  if (reviewed === 1) verdictTpl = verdictTpl.replace('references were reviewed', 'reference was reviewed');
  document.getElementById('verdict').innerHTML = verdictTpl.replace('{n}', reviewed).replace('{m}', nAffectedReferences);
  if (DATA.show_summary === false) document.querySelector('.ficha').hidden = true;
  document.getElementById('l-stat-content').textContent = T.statContent;
  document.getElementById('l-stat-meta').textContent = T.statMeta;
  document.querySelectorAll('.stat-hint').forEach(function (el) { el.textContent = T.hint; });
  document.getElementById('n-content').textContent = nContent;
  document.getElementById('n-meta').textContent = nMeta;
  document.getElementById('u-content').textContent = T.unit[nContent === 1 ? 0 : 1];
  document.getElementById('u-meta').textContent = (T.refUnit || T.unit)[nMeta === 1 ? 0 : 1];
  document.getElementById('method').textContent = T.method;
  document.getElementById('clear-filter').textContent = T.viewAll;

  document.getElementById('list').innerHTML = CASES.map(function (c) {
    return c.kind === 'metadata' ? renderMetadata(c) : renderContent(c);
  }).join('');

  /* glossary: only the error types that appear in this report */
  var used = {};
  CASES.forEach(function (c) { used[c.error_type] = true; });
  var glossIds = ORDER.filter(function (id) { return used[id]; });
  Object.keys(used).forEach(function (id) { if (glossIds.indexOf(id) < 0) glossIds.push(id); });
  var glossRows = glossIds.map(function (id) {
    var e = CATALOG[id] || { kind: 'content', label: { en: id }, desc: {} };
    return { kind: e.kind, html: '<dt><span class="dot ' + (e.kind === 'metadata' ? 'm' : 'c') + '"></span>' + esc(pick(e.label)) + '</dt><dd>' + esc(pick(e.desc)) + '</dd>' };
  });
  glossRows.sort(function (a, b) { return (a.kind === 'metadata') - (b.kind === 'metadata'); });
  var hasC = glossRows.some(function (r) { return r.kind !== 'metadata'; });
  var hasM = glossRows.some(function (r) { return r.kind === 'metadata'; });
  document.getElementById('gloss-title').textContent = T.glossaryTitle;
  document.getElementById('gloss-intro').textContent = hasC && hasM ? T.glossaryBoth : (hasC ? T.glossaryContent : T.glossaryMeta);
  document.getElementById('gloss-list').innerHTML = glossRows.map(function (r) { return r.html; }).join('');
  if (!glossRows.length) document.getElementById('glossary').hidden = true;

  /* ------------------------------------------------------------------ *
   *  8. INTERACTION                                                    *
   * ------------------------------------------------------------------ */
  var active = null;
  var banner = document.getElementById('active-filter');
  var bannerText = document.getElementById('filter-text');
  var bannerMsg = { content: T.filterContent, metadata: T.filterMeta };

  function applyFilter(kind) {
    active = kind;
    document.querySelectorAll('.stat').forEach(function (s) {
      s.setAttribute('aria-pressed', String(s.dataset.filter === kind));
    });
    document.querySelectorAll('.case').forEach(function (el) {
      el.hidden = !!kind && el.dataset.kind !== kind;
    });
    banner.hidden = !kind;
    if (kind) bannerText.innerHTML = bannerMsg[kind];
  }
  document.addEventListener('click', function (e) {
    var stat = e.target.closest('.stat');
    if (stat) {
      applyFilter(active === stat.dataset.filter ? null : stat.dataset.filter);
      return;
    }
    if (e.target.closest('#clear-filter')) {
      applyFilter(null);
      return;
    }
    var headBtn = e.target.closest('.case-head');
    if (headBtn) {
      var body = document.getElementById(headBtn.getAttribute('aria-controls'));
      var open = headBtn.getAttribute('aria-expanded') === 'true';
      headBtn.setAttribute('aria-expanded', String(!open));
      body.hidden = open;
      var label = headBtn.querySelector('.disclose-label');
      if (label) label.textContent = open ? T.showEv : T.hideEv;
      return;
    }
    var copy = e.target.closest('.copy');
    if (copy) {
      var text = copy.closest('.rewrite-body').querySelector('[data-rewrite]').textContent.trim();
      var done = function () {
        copy.innerHTML = iconCheck;
        setTimeout(function () { copy.innerHTML = iconCopy; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else { done(); }
    }
  });
})();
</script>
<script>
(function () {
  const STORAGE_KEY = 'refcheck-last-analysis';
  const form = document.getElementById('upload-form');
  const statusBox = document.getElementById('upload-status');
  const list = document.getElementById('list');
  const submitButton = document.getElementById('submit-button');

  if (!form) return;

  function setStatus(message, type) {
    if (!statusBox) return;
    statusBox.textContent = message || '';
    statusBox.className = 'upload-status';
    if (type) statusBox.classList.add(type);
  }

  function saveState(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function clearState() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function isGenericMatchRule(value) {
    if (value == null) return true;
    const normalised = String(value).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    return ['author_year_lead_author_and_year', 'numbered_reference_number', 'local_match', 'citation_match', 'reference_number_match'].includes(normalised);
  }

  function normaliseMatchLabel(match) {
    const raw = match && (
      match.error_type ||
      match.primary_family ||
      match.secondary_family ||
      (match.match_rule && !isGenericMatchRule(match.match_rule) ? match.match_rule : null) ||
      match.status ||
      match.verdict ||
      'Citation issue'
    );
    const text = String(raw).trim();
    const map = {
      'the_source_says_the_opposite': 'The source says the opposite',
      'source_says_opposite': 'The source says the opposite',
      'the_study_did_not_do_that': 'The study did not do that',
      'study_did_not_do_that': 'The study did not do that',
      'data_does_not_match_the_study': 'Data does not match the study',
      'data_mismatch': 'Data does not match the study',
      'inflated_figure': 'Inflated figure',
      'figure_taken_out_of_context': 'Figure taken out of context',
      'one_measure_confused_with_another': 'One measure confused with another',
      'measure_confused': 'One measure confused with another',
      'incorrect_reference_details': 'Incorrect reference details',
      'wrong_reference_details': 'Incorrect reference details',
      'fabricated_reference': 'Fabricated reference',
      'reference_list_bibliography': 'reference list/bibliography',
      'matched': 'Matched',
      'supported': 'Supported',
      'issue': 'Citation issue',
      'unmatched': 'Citation issue',
      'unsupported': 'Unsupported citation'
    };
    const lowered = text.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    return map[lowered] || text.replace(/_/g, ' ').replace(/\s+/g, ' ').trim() || 'Citation issue';
  }

  function getMatchPillClass(match) {
    const status = String((match && (match.status || match.verdict || '')) || '').toLowerCase();
    const kind = String((match && (match.kind || '')) || '').toLowerCase();
    const family = String((match && (match.error_type || match.primary_family || match.secondary_family || '')) || '').toLowerCase();
    const metadataFamily = ['wrong_reference_details', 'incorrect_reference_details', 'retracted_article', 'doi_leads_elsewhere', 'citation_without_reference'];

    if (status === 'matched' || status === 'supported' || status === 'ok' || status === 'pass') {
      return 'pill-green';
    }
    if (kind === 'metadata' || metadataFamily.includes(family)) {
      return 'pill-amber';
    }
    return 'pill-red';
  }

  function isGenericDefaultReasonText(value) {
    if (value == null) return true;
    const text = String(value).trim();
    const genericDefaults = [
      'The manuscript citation was matched to the corresponding reference entry.',
      'The citation was checked against the corresponding reference entry.',
      'The manuscript citation was matched to the corresponding reference entry',
      'The citation was checked against the corresponding reference entry',
      'This citation was reviewed against the referenced material.'
    ];
    return genericDefaults.includes(text);
  }

  function getMatchReason(match) {
    if (!match) return 'This citation was reviewed against the referenced material.';
    const genericRules = ['author_year_lead_author_and_year', 'numbered_reference_number', 'local_match', 'citation_match', 'reference_number_match'];
    const candidates = [
      match.observation,
      match.explanation,
      match.error_type,
      match.primary_family,
      match.secondary_family,
      match.reason,
      match.match_rule
    ];

    for (const candidate of candidates) {
      if (candidate == null || candidate === '') continue;
      const text = String(candidate).trim();
      if (isGenericDefaultReasonText(text)) continue;
      if (text && !genericRules.includes(String(candidate).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''))) {
        return text;
      }
    }

    const status = String((match.status || match.verdict || '') || '').toLowerCase();
    if (status === 'matched' || status === 'supported' || status === 'ok' || status === 'pass') {
      return 'The manuscript citation was matched to the corresponding reference entry.';
    }
    return match.status || match.verdict || 'This citation was reviewed against the referenced material.';
  }

  function getMatchClaim(match) {
    return match && (match.sentence_text || match.claim || match.text || 'No manuscript claim available.');
  }

  function getSourceUrl(match) {
    if (!match) return '';
    const candidates = [
      match.source_url,
      match.url,
      match.doi,
      match.reference_text,
      match.source_excerpt,
      match.evidence_quote,
      match.reference,
      match.reference_official,
      match.reference_as_generated
    ];

    for (const candidate of candidates) {
      if (candidate == null || candidate === '') continue;
      const text = String(candidate).trim();
      if (!text) continue;
      if (/^https?:\/\//i.test(text)) return text;
      if (/^doi:/i.test(text)) return 'https://doi.org/' + text.replace(/^doi:/i, '');
      const doiMatch = text.match(/10\.\d{4,9}\/[\w\-._;()/:]+/i);
      if (doiMatch) return 'https://doi.org/' + doiMatch[0];
      if (/^10\.\d{4,9}\//i.test(text)) return 'https://doi.org/' + text.replace(/^https?:\/\/doi\.org\//i, '').replace(/^https?:\/\//i, '');
    }

    return '';
  }

  function getSourcePassage(match) {
    if (!match) return 'No source excerpt available.';
    return match.source_excerpt || match.evidence_quote || 'No source excerpt available.';
  }

  function getReferenceText(match) {
    if (!match) return 'No cited source entry available.';
    return match.reference_text || match.reference || match.reference_official || match.reference_as_generated || match.reason || match.explanation || 'No cited source entry available.';
  }

  function getSourceExcerpt(match) {
    return getSourcePassage(match);
  }

  function getSourceLabel(match) {
    return 'Cited source';
  }

  function dedupeVisibleCases(matches) {
    const seen = new Set();
    const unique = [];

    for (const match of Array.isArray(matches) ? matches : []) {
      if (!match) continue;
      const keyParts = [
        match.case_key,
        match.citation,
        match.marker,
        match.reference_id,
        match.matched_reference,
        match.reference,
        match.reference_text,
        match.sentence_id,
        match.id
      ].filter(function (value) {
        return value !== undefined && value !== null && String(value).trim() !== '';
      });

      const key = keyParts.length ? keyParts.map(function (value) {
        return String(value).trim();
      }).join('|') : JSON.stringify(match);

      if (seen.has(key)) continue;
      seen.add(key);
      unique.push(match);
    }

    return unique;
  }

  function renderAnalysisDesign(report, fileName) {
    const sourceFile = (report && (report.source_file || report.manuscript_file || fileName)) || 'Manuscript reviewed';
    const summary = (report && report.summary) || {};
    const matches = Array.isArray(report && report.citation_matches) ? report.citation_matches : [];
    const visibleMatches = dedupeVisibleCases(matches);
    const references = Array.isArray(report && report.references) ? report.references : [];
    const reviewedCount = Math.max(references.length || 0, Array.isArray(report && report.dataset_rows) ? report.dataset_rows.length : 0, visibleMatches.length || 0);

    const title = document.getElementById('t-title');
    const docTitle = document.getElementById('doc-title');
    const ident = document.getElementById('ident');
    const verdict = document.getElementById('verdict');
    const list = document.getElementById('list');
    const nContent = document.getElementById('n-content');
    const nMeta = document.getElementById('n-meta');
    const uContent = document.getElementById('u-content');
    const uMeta = document.getElementById('u-meta');

    const contentMatches = Array.isArray(visibleMatches) ? visibleMatches.filter(function (match) {
      if (!match || match.kind === 'metadata') return false;
      const ref = match && (match.matched_reference !== undefined && match.matched_reference !== null ? match.matched_reference : match.reference_id);
      return ref !== undefined && ref !== null && ref !== '';
    }) : [];
    const uniqueContentRefs = new Set(contentMatches.map(function (match) { return String(match.matched_reference ?? match.reference_id); }));
    const errorCount = uniqueContentRefs.size;

    if (title) title.textContent = 'Citation Fidelity Review';
    if (docTitle) docTitle.textContent = sourceFile;

    if (ident) {
      ident.innerHTML = [
        '<div><dt>Manuscript reviewed</dt><dd><code>' + sourceFile + '</code></dd></div>'
      ].join('');
    }

    if (verdict) {
      const reviewedLabel = reviewedCount === 1 ? 'reference was reviewed' : 'references were reviewed';

    }

    if (statusBox) {
      setStatus(fileName ? 'Analysis complete for ' + fileName + '.' : 'Analysis complete.', 'success');

  }

  function renderResult(report, fileName) {
    if (!report) return;
    if (list) {
      const matches = Array.isArray(report.citation_matches) ? report.citation_matches : [];
      const visibleMatches = dedupeVisibleCases(matches);
      const rows = visibleMatches.length ? visibleMatches.map(function (match) {
        const marker = match && (match.citation || match.marker || '[citation]');
        const label = normaliseMatchLabel(match);
        const reason = getMatchReason(match);
        const claim = getMatchClaim(match);
        const sourcePassage = getSourcePassage(match);
        const referenceText = getReferenceText(match);
        const sourceLabel = getSourceLabel(match);
        const sourceUrl = getSourceUrl(match);
        const viewSourceLink = sourceUrl ? '<a class="link" href="' + sourceUrl + '" target="_blank" rel="noopener">View source</a>' : '';
        const statusClass = getMatchPillClass(match);
        const kind = (match && (match.kind === 'metadata' ? 'metadata' : 'content')) || 'content';
        const status = String((match && (match.status || match.verdict || '')) || '').toLowerCase();
        return '<article class="case" data-kind="' + kind + '" data-status="' + status + '">' +
          '<button class="case-head" aria-expanded="false" aria-controls="analysis-case-' + marker.replace(/[^a-zA-Z0-9_-]/g, '') + '">' +
            '<span class="case-main">' +
              '<span class="marker">' + marker + '</span>' +
              '<span class="pill ' + statusClass + '">' + label + '</span>' +
            '</span>' +
            '<span class="disclose"><span class="disclose-label">Show evidence</span>' +
              '<span class="toggle-sq" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14.5 6-6 6 6"/></svg></span>' +
            '</span>' +
          '</button>' +
          '<div class="case-body" id="analysis-case-' + marker.replace(/[^a-zA-Z0-9_-]/g, '') + '" hidden>' +
            '<div class="panels">' +
              '<section class="panel"><div class="panel-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a7.5 7.5 0 0 1-7.5 7.5H8L4 22l1-3.6A7.5 7.5 0 1 1 20 12Z"/><path d="M9 11.5h.01"/><path d="M12.5 11.5h.01"/><path d="M16 11.5h.01"/></svg><b>What the reviewed manuscript claims</b></div><p>' + claim + '</p></section>' +
              '<section class="panel"><div class="panel-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><b>What the source says</b> <span>(passage from the cited work)</span></div><p class="plain"><b>Assessment:</b> ' + sourcePassage + '</p></section>' +
            '</div>' +
            '<section class="section"><span class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg><b>RefCheck observation</b></span><p class="observacion">' + reason + '</p></section>' +
            '<section class="section"><div class="section-head"><span class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><b>' + sourceLabel + '</b></span>' + viewSourceLink + '</div><p class="ref">' + referenceText + '</p></section>' +
