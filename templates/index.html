      list.innerHTML = rows;
    }
    renderAnalysisDesign(report, fileName);
    attachCaseFilters();
  }

  function attachCaseFilters() {
    if (document.__refcheckFilterBound) return;
    document.__refcheckFilterBound = true;

    const banner = document.getElementById('active-filter');
    const filterText = document.getElementById('filter-text');
    const clearButton = document.getElementById('clear-filter');
    let activeKind = null;

    function applyFilter(kind) {
      const stats = document.querySelectorAll('.stat');
      const matches = list ? list.querySelectorAll('.case') : [];

      stats.forEach(function (button) {
        const active = button.dataset.filter === kind;
        button.setAttribute('aria-pressed', String(active));
      });

      matches.forEach(function (article) {
        const visibleKind = article.dataset.kind || 'content';
        const status = String(article.dataset.status || '').toLowerCase();
        const isMatched = status === 'matched' || status === 'supported' || status === 'ok' || status === 'pass';

        if (kind === 'content') {
          article.hidden = isMatched;
        } else {
          article.hidden = !!kind && visibleKind !== kind;
        }
      });

      if (banner) {
        banner.hidden = !kind;
      }
      if (filterText) {
        if (kind === 'content') {
          filterText.innerHTML = 'Showing only <b>citations the source does not support</b>.';
        } else if (kind === 'metadata') {
          filterText.innerHTML = 'Showing only <b>references with metadata problems</b>.';
        } else {
          filterText.textContent = '';
        }
      }
    }

    document.addEventListener('click', function (event) {
      const stat = event.target.closest('.stat');
      if (stat) {
        const nextKind = stat.dataset.filter;
        activeKind = activeKind === nextKind ? null : nextKind;
        applyFilter(activeKind);
        return;
      }
      if (event.target.closest('#clear-filter')) {
        activeKind = null;
        applyFilter(null);
      }
    }, { once: false });

    if (clearButton) {
      clearButton.addEventListener('click', function () {
        activeKind = null;
        applyFilter(null);
      });
    }
  }

  function isBusy(value) {
    if (!submitButton) return;
    submitButton.disabled = !!value;
    submitButton.textContent = value ? 'Analysing...' : 'Analyse';
  }

  function pollJob(jobId, fileName) {
    if (!jobId) return;
    function tick() {
      fetch('/api/progress/' + encodeURIComponent(jobId))
        .then(function (response) { return response.json(); })
        .then(function (payload) {
          if (payload && payload.status === 'running') {
            const latest = payload.progress && payload.progress.length ? payload.progress[payload.progress.length - 1] : null;
            if (latest && latest.message) setStatus(latest.message, '');
            setTimeout(tick, 1200);
            return;
          }

          if (payload && payload.status === 'done' && payload.report) {
            renderResult(payload.report, fileName);
            saveState({ status: 'done', jobId: jobId, fileName: fileName, report: payload.report, updatedAt: Date.now() });
            isBusy(false);
            return;
          }

          if (payload && payload.status === 'error') {
            setStatus(payload.error || 'The analysis failed.', 'error');
            clearState();
            isBusy(false);
            return;
          }

          if (payload && payload.error) {
            setStatus(payload.error, 'error');
            clearState();
            isBusy(false);
            return;
          }

          setTimeout(tick, 1200);
        })
        .catch(function () {
          setStatus('Connection issue while polling for results.', 'error');
          isBusy(false);
        });
    }
    tick();
  }

  function restoreSavedState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!saved) return;
      if (saved.status === 'done' && saved.report) {
        renderResult(saved.report, saved.fileName || 'saved analysis');
        setStatus('Restored previous results.', 'success');
      } else if (saved.jobId) {
        setStatus('Previous analysis is still running...', '');
        pollJob(saved.jobId, saved.fileName || 'current manuscript');
      }
    } catch (e) {}
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    const fileInput = document.getElementById('manuscript-file');
    const file = fileInput && fileInput.files ? fileInput.files[0] : null;
    if (!file) {
      setStatus('Please select a manuscript file first.', 'error');
      return;
    }

    const data = new FormData();
    data.append('file', file);
    isBusy(true);
    setStatus('Uploading manuscript...', '');

    fetch('/api/upload-manuscript', { method: 'POST', body: data })
      .then(function (response) {
        return response.json().then(function (json) {
          if (!response.ok) throw new Error(json && json.error ? json.error : 'Upload failed.');
          return json;
        });
      })
      .then(function (payload) {
        if (!payload || !payload.job_id) throw new Error('No job id returned by the server.');
        saveState({ status: 'running', jobId: payload.job_id, fileName: file.name, updatedAt: Date.now() });
        setStatus('Analysis started for ' + file.name + '. Please wait...', '');
        pollJob(payload.job_id, file.name);
      })
      .catch(function (err) {
        isBusy(false);
        setStatus(err.message || 'Upload failed.', 'error');
      });
  });

  restoreSavedState();
})();

<script>
(function () {
  /* Download button: shown only when build/render.py embedded a PDF (--pdf). */
  var link = document.getElementById('dl-pdf');
  var b64 = document.getElementById('report-pdf').textContent.trim();
  if (!link || !b64 || b64.indexOf('__REPORT_PDF') === 0) return;
  var lang = JSON.parse(document.getElementById('report-data').textContent).lang;
  var T = JSON.parse(document.getElementById('report-i18n').textContent);
  document.getElementById('dl-label').textContent = (T[lang] || T.en).downloadPdf || 'Download PDF';
  var name = JSON.parse(document.getElementById('report-data').textContent).pdf_filename;
  if (name) link.setAttribute('download', name);
  link.hidden = false;
  link.addEventListener('click', function (e) {
    e.preventDefault();
    var raw = atob(b64), bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    var a = document.createElement('a'); a.href = url; a.download = link.getAttribute('download');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  });
})();
</script>
