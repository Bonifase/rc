services:
  - type: web
    name: citation-fidelity-checker-api
    runtime: python
    plan: starter  # persistent disks are not available on the free plan
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --timeout 600 --workers 1 --threads 4 --chdir webapp/backend app:app"
    disk:
      name: refcheck-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: REFCHECK_LIVE_JUDGE
        value: "1"  # without this the judge never calls OpenAI
      - key: REFCHECK_ALLOW_OFFLINE_SIMULATION
        value: "0"
      - key: REFCHECK_DATA_DIR
        value: /var/data/refcheck  # must sit under the disk mountPath so jobs, uploads and the call store survive restarts and deploys
      - key: CONTACT_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false  # set only in Render environment secrets; never commit the value
      - key: API_KEY
        sync: false  # optional -- set to require X-API-Key on /api/analyze*; leave blank to keep the API open
      - key: ALLOWED_ORIGIN
        value: "*"  # in the Render dashboard set this to your Vercel frontend URL, e.g. https://fidelity-kappa.vercel.app (no trailing slash)
